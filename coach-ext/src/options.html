<meta charset="utf-8" />
<title>Coach — sonde web</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 0; padding: 18px; width: 360px;
         background: #191320; color: #ede6f5; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p  { color: #9a8cae; font-size: 12.5px; margin: 0 0 14px; }
  label { display: block; font-size: 12px; color: #9a8cae; margin: 12px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; background: #120d18;
                    color: #ede6f5; border: 1px solid rgba(237,230,245,.16); font-family: ui-monospace, monospace;
                    font-size: 12px; }
  textarea { height: 150px; resize: vertical; }
  button { margin-top: 14px; padding: 9px 16px; background: #e8a33d; color: #120d18;
           border: 0; font-weight: 600; cursor: pointer; }
  .state { margin-top: 12px; font-size: 12px; color: #6b5f7d; }
  .err { color: #de5f7e; }
  .bloc { margin: 0 0 18px; padding: 12px; background: #120d18;
          border-left: 2px solid #4fc4b4; }
  .bloc h2 { font-size: 13px; margin: 0 0 4px; }
  .bloc p { margin: 0; font-size: 12px; }
  .bloc button { margin-top: 10px; padding: 7px 12px; background: transparent;
                 color: #9a8cae; border: 1px solid rgba(237,230,245,.24); font-weight: 400; }
  .arme { border-left-color: #e8a33d; }
</style>

<h1>Sonde web</h1>
<p>Seules des catégories et des durées sont envoyées. Aucune adresse ne quitte ce navigateur.</p>

<div class="bloc" id="bloc">
  <h2 id="blocTitre">Blocage</h2>
  <p id="blocEtat"></p>
  <button id="lever" hidden>Lever le blocage</button>
</div>

<label for="apiUrl">Adresse de l'API</label>
<input id="apiUrl" placeholder="http://127.0.0.1:8000" />

<label for="token">Jeton de sonde</label>
<input id="token" type="password" placeholder="python manage.py probetoken --issue ext" />

<label for="rules">Catégories (JSON, reste sur cette machine)</label>
<textarea id="rules" spellcheck="false"></textarea>

<button id="save">Enregistrer</button>
<div class="state" id="state"></div>

<script type="module" src="options.js"></script>
